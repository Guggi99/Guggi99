# Rebuilds the two stats cards shown in the profile README
# (profile/stats.svg and profile/top-langs.svg) once a day and commits them.
#
# The project repos are private, so the built-in GITHUB_TOKEN would only see
# this one repo and the cards would show almost nothing. The cards therefore read
# the account with a personal access token saved as the secret STATS_TOKEN
# (fine-grained, all repositories, read-only access to contents and metadata).
# The cards show totals and languages only, never repo names.

name: Update GitHub Stats

on:
  schedule:
    # Run every day at 03:00 UTC
    - cron: "0 3 * * *"

  # Allow a manual run from the Actions tab
  workflow_dispatch:

permissions:
  # Needed to commit the regenerated cards back into this repo
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      # Get this repo so the cards can be written into profile/
      - name: Checkout repository
        uses: actions/checkout@v6

      # Totals card: commits only (count_private adds private work).
      # PRs and issues are hidden: the fine-grained token cannot see the ones in
      # private repos, so the card would show 0 and 1 instead of the real numbers.
      # The rank circle is hidden too, since it is computed from those wrong counts.
      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&hide_title=true&hide_border=true&theme=transparent&include_all_commits=true&count_private=true&hide=stars,contribs,prs,issues&hide_rank=true&number_format=long"
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      # Languages card: top 6 languages across the owner's repos,
      # notebooks and LaTeX report files (TeX, BibTeX Style) left out
      - name: Generate language stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&hide_title=true&hide_border=true&theme=transparent&langs_count=6&hide=Jupyter%20Notebook,TeX,BibTeX%20Style&size_weight=0.5&count_weight=0.5"
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}

      # Commit the cards only if they changed
      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg
          git commit -m "Update GitHub stats" || exit 0
          git push
